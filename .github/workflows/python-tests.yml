name: python-tests

# Runs the full Python suite (~1,986 tests) on every push and PR.
#
# ## Why this did not exist until now, and why that mattered
#
# CI ran java-tests, gitleaks and bingx-hostname-guard -- and nothing
# that executed a single Python test. Meanwhile the Auto-merge Policy in
# CLAUDE.md says non-CODEOWNERS paths (Python research/backtest code,
# "most of the repo by volume") merge on "CI + CodeRabbit passing"
# alone, with no human review.
#
# So the largest body of code in this repository was auto-merging behind
# a gate that never ran its tests. Found 2026-09-06 while auditing what
# actually catches defects in this project; the honest answer for Python
# was "CodeRabbit, or production".
#
# ## Deliberately no credentials and no network
#
# Matching java-tests.yml and CLAUDE.md's "never add live exchange
# write-access in CI": no secrets are referenced, and every test in this
# suite is hermetic -- network-touching modules are exercised against
# in-process fakes or monkeypatched fetchers, never a real venue.
#
# `python/tests/conftest.py` additionally redirects every experiment-log
# write to a per-test temp directory, so a CI run cannot append to
# `runs/experiments.jsonl` -- the file behind the DSR trial count `N`.
# That isolation is itself tested (test_conftest_isolation.py), and this
# workflow asserts the committed logs are byte-identical afterwards, so
# a regression in it fails here rather than silently corrupting `N`.

on:
  push:
  pull_request:

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        working-directory: python
        # `--frozen` fails rather than silently resolving a different set
        # when uv.lock is out of date with pyproject.toml. A CI run that
        # quietly tests different versions than the lockfile pins is
        # testing something nobody has.
        run: uv sync --frozen

      - name: Record the committed logs before the suite runs
        # The suite must not append to either. `runs/experiments.jsonl`
        # feeds the DSR trial count `N`; `runs/live_signals.jsonl` is the
        # operational audit trail. Both are git-tracked and both have
        # been polluted by tests before -- experiments.jsonl still
        # carries two `test-ofi-momentum` records from 2026-08.
        run: |
          sha256sum runs/experiments.jsonl runs/live_signals.jsonl > /tmp/logs-before.sha256
          cat /tmp/logs-before.sha256

      - name: Run the test suite
        working-directory: python
        # From `python/`, because several tests resolve fixture paths
        # relative to the working directory. PYTHONPATH is `.` for the
        # same reason the local invocation uses it -- the packages live
        # directly under python/, not in an installed distribution.
        env:
          PYTHONPATH: .
        run: uv run --frozen python -m pytest -q

      - name: Assert the committed logs are unchanged
        # A guard nobody verifies is worse than no guard. The isolation
        # fixture has silently failed three times during its own
        # development, each time while its unit tests passed -- what
        # caught it every time was comparing these checksums.
        run: |
          if ! sha256sum --check --status /tmp/logs-before.sha256; then
            echo "::error::the test suite modified a committed run log."
            echo "runs/experiments.jsonl feeds the DSR trial count N; runs/live_signals.jsonl"
            echo "is the operational audit trail. Neither may be written by tests."
            echo "See python/tests/conftest.py and test_conftest_isolation.py."
            sha256sum runs/experiments.jsonl runs/live_signals.jsonl
            exit 1
          fi
          echo "committed run logs unchanged"

      - name: Assert no stray runs/ directory was created
        # A relative `runs/` path resolves against whatever directory
        # pytest started in. That is how `python/runs/` appeared once
        # before -- the same defect as above, wearing a different hat.
        run: |
          if [ -e python/runs ]; then
            echo "::error::python/runs/ was created -- a relative runs_path escaped the fixture."
            ls -la python/runs
            exit 1
          fi
          echo "no stray python/runs/"
